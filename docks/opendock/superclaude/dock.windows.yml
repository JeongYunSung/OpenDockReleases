opendock: 1
summary: Claude Code에 전문 명령과 작업 역할을 더해 복잡한 개발 작업을 구조적으로 수행합니다.
readme: DOCK.md
logo: logo.png
tags:
  - superclaude
  - claude-code
  - agent-workflow
  - commands
  - personas
  - planning
requires:
  runtimes:
    python: ">=3.11.0 <3.14.0"
    uv: ">=0.7.0"
tools:
  superclaude:
    manager: uv
    package: superclaude
    version: "4.3.0"
    commands:
      - superclaude
files:
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/AGENTS.md
    to: CLAUDE.md
  - from: files/AGENTS.md
    to: GEMINI.md
  - from: files/.opendock/docks/superclaude/README.md
    to: .opendock/docks/superclaude/README.md
  - from: files/.opendock/docks/superclaude/SUPERCLAUDE.md
    to: .opendock/docks/superclaude/SUPERCLAUDE.md
  - from: files/.opendock/docks/superclaude/SUPERCLAUDE_RUN.md
    to: .opendock/docks/superclaude/SUPERCLAUDE_RUN.md
doctor:
  - id: superclaude-cli
    run: superclaude --version
  - id: superclaude-docs
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/docks/superclaude/README.md) { exit 0 } else { exit 1 }"
