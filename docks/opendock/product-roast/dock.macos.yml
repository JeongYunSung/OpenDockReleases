opendock: 1
summary: 제품 화면과 메시지를 솔직하게 비평하고 가장 먼저 고칠 문제를 찾아냅니다.
readme: DOCK.md
logo: logo.png
tags:
  - product
  - roast
  - review
  - ux
  - conversion
files:
  - from: files/.opendock/docks/product-roast/README.md
    to: .opendock/docks/product-roast/README.md
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/.opendock/docks/product-roast/PRODUCT_ROAST_PLAYBOOK.md
    to: .opendock/docks/product-roast/PRODUCT_ROAST_PLAYBOOK.md
  - from: files/.agents/skills/opendock-product-roast/SKILL.md
    to: .agents/skills/opendock-product-roast/SKILL.md
  - from: files/.opendock/templates/product-roast/RUN.md
    to: .opendock/templates/product-roast/RUN.md
doctor:
  - id: product-roast-readme
    check: test -f .opendock/docks/product-roast/README.md
  - id: product-roast-agents
    check: test -f AGENTS.md
  - id: product-roast-playbook
    check: test -f .opendock/docks/product-roast/PRODUCT_ROAST_PLAYBOOK.md
  - id: product-roast-skill
    check: test -f .agents/skills/opendock-product-roast/SKILL.md
  - id: product-roast-run-template
    check: test -f .opendock/templates/product-roast/RUN.md
