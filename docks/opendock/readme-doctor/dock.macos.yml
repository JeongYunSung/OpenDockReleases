opendock: 1
summary: README를 처음 보는 사람이 제품을 이해하고 바로 실행할 수 있게 고칩니다.
readme: DOCK.md
logo: logo.png
tags:
  - readme
  - documentation
  - audit
  - quick-start
  - maintenance
files:
  - from: files/.opendock/docks/readme-doctor/README.md
    to: .opendock/docks/readme-doctor/README.md
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/.opendock/docks/readme-doctor/README_DOCTOR_PLAYBOOK.md
    to: .opendock/docks/readme-doctor/README_DOCTOR_PLAYBOOK.md
  - from: files/.agents/skills/opendock-readme-doctor/SKILL.md
    to: .agents/skills/opendock-readme-doctor/SKILL.md
  - from: files/.opendock/templates/readme-doctor/RUN.md
    to: .opendock/templates/readme-doctor/RUN.md
doctor:
  - id: readme
    check: test -f .opendock/docks/readme-doctor/README.md
  - id: agents
    check: test -f AGENTS.md
  - id: playbook
    check: test -f .opendock/docks/readme-doctor/README_DOCTOR_PLAYBOOK.md
  - id: skill
    check: test -f .agents/skills/opendock-readme-doctor/SKILL.md
  - id: run-template
    check: test -f .opendock/templates/readme-doctor/RUN.md
