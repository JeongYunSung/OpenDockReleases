opendock: 1
summary: 구독, 갱신, 보증, 서류처럼 자주 놓치는 생활 업무를 한곳에서 관리합니다.
readme: DOCK.md
logo: logo.png
tags:
  - life-admin
  - subscriptions
  - renewals
  - documents
  - warranty
  - reminders
  - privacy
files:
  - from: files/.opendock/docks/life-admin/README.md
    to: .opendock/docks/life-admin/README.md
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/.opendock/docks/life-admin/LIFE_ADMIN_PLAYBOOK.md
    to: .opendock/docks/life-admin/LIFE_ADMIN_PLAYBOOK.md
  - from: files/.agents/skills/opendock-life-admin/SKILL.md
    to: .agents/skills/opendock-life-admin/SKILL.md
  - from: files/.opendock/templates/life-admin
    to: .opendock/templates/life-admin
doctor:
  - id: life-admin-readme
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/docks/life-admin/README.md) { exit 0 } else { exit 1 }"
  - id: life-admin-agents
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath AGENTS.md) { exit 0 } else { exit 1 }"
  - id: life-admin-playbook
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/docks/life-admin/LIFE_ADMIN_PLAYBOOK.md) { exit 0 } else { exit 1 }"
  - id: life-admin-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .agents/skills/opendock-life-admin/SKILL.md) { exit 0 } else { exit 1 }"
  - id: life-admin-run-template
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/templates/life-admin/RUN.md) { exit 0 } else { exit 1 }"
